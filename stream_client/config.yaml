# ---------------------------------------------------------------------
# stream_client config — AU framed H.265 over TCP (single Zenoh path)
# ---------------------------------------------------------------------
# TCP wire spec: /home/nev/teleop/TCP_WIRE_SPEC.md
#
# 동일 Zenoh router (7457) 위에 camera AU + control plane 가 함께 흐른다.
# UDP locator / RTP jitterbuffer / PLI / RTX / FEC 는 일체 없음.
server_tcp_locator: "tcp/127.0.0.1:7447"

# 봇/서버와 같아야 함.
vehicle_id: "0"

# 멀티 카메라 — 봇이 publish 하는 cam_id 리스트.
# 비어 있으면 (또는 키 자체가 없으면) 단일 카메라 모드로 폴백 (video.camera_id).
cameras: ["left", "front", "right", "rear"]

# stream_heartbeat 5 Hz (spec §6.c)
stream_heartbeat_rate: 5.0

# Stale-AU drop threshold (spec §8).
# now - vehicle_ts 가 이 값(ms)을 초과하고 IDR 가 아니면 즉시 폐기한다.
stale_threshold_ms: 150

# Expected frame rate. video_feedback freeze_ms_last_1s 계산에 사용
# (frame 간격이 1.5/fps 초과 시 freeze 누적).
fps_expected: 30.0

# ---- video ----
video:
  # NVDEC 전용 — SW 폴백 없음.
  decoder_preference:
    - nvh265dec
  # camera_id: "" = 단일 카메라 (.../camera)
  #             "front" 등 = 멀티 카메라 (.../camera/front)
  camera_id: ""

# ---- GUI ----
gui:
  window_min_width: 1280
  window_min_height: 720
  font_family: "Consolas, 'Courier New', monospace"
  panel_width: 340

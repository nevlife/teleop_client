[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleop_station"
version = "0.1.0"
description = "NEV teleop — unified operator station (joystick + telemetry + video in one Qt process)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "eclipse-zenoh",
  "pygame",
  "PyYAML",
  "PySide6",
]
# PyGObject / pycairo / GStreamer come from system apt (`python3-gi`,
# `python3-gst-1.0`) and are visible to the venv via
# `uv venv --system-site-packages`. Building pycairo from PyPI requires
# libcairo headers which we don't need.

[project.scripts]
teleop-ui = "teleop_ui.main:main"

[tool.setuptools]
packages = [
  "teleop_client",
  "teleop_client.controller",
  "teleop_client.gui",
  "stream_client",
  "stream_client.gui",
  "teleop_ui",
  "teleop_contracts",
]

[tool.setuptools.package-dir]
teleop_client = "teleop_client/teleop_client"
"teleop_client.controller" = "teleop_client/teleop_client/controller"
"teleop_client.gui" = "teleop_client/teleop_client/gui"
stream_client = "stream_client/stream_client"
"stream_client.gui" = "stream_client/stream_client/gui"
teleop_ui = "teleop_ui/teleop_ui"
teleop_contracts = "teleop_client/teleop_contracts/teleop_contracts"

# ---------------------------------------------------------------------
# teleop_client config — control / telemetry only
# ---------------------------------------------------------------------
# teleop_client connects to the unified server router on TCP 7447. The
# server hosts both the teleop (control/telemetry) and stream_tcp (video)
# prefixes on the same router; stream_client uses the same locator.
server_tcp_locator: "tcp/127.0.0.1:7447"

# Must match the bot's vehicle_id. Same value as stream_client.
vehicle_id: "0"

heartbeat_rate: 5.0
teleop_rate: 20.0
ping_rate: 1.0

controller_type: joystick

joystick:
  axis_speed: 1
  axis_steer: 3
  btn_estop: 4          # shoulder button for e-stop toggle
  max_speed: 1.0        # m/s
  max_steer_deg: 27.0
  deadzone: 0.05        # joystick deadzone
  invert_speed: true    # invert speed axis (forward is negative on some controllers)
  estop_on_disconnect: true  # auto-fire E-stop if the joystick is physically removed
